    <script type="application/ld+json">

        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://flixy.app/#website",
            "url": "https://flixy.app/",
            "name": "Flixy",
            "description": "Flixy helps you find what to watch tonight by curating movies and shows for your taste."

          {
            "@type": "SoftwareApplication",
            "@id": "https://flixy.app/#application",
            "url": "https://flixy.app/",
            "name": "Flixy",
            "description": "Swipe through movies and shows curated for your taste, then jump straight into your streaming app.",

            "operatingSystem": "iOS, Android"
          }
        ]

    <main class="hero">
      <div class="container">
        <p class="brand">Flixy</p>
        <h1>Find what to watch tonight.</h1>

        <div class="badges">

            href="https://apps.apple.com/app/flixy"
            class="badge"
            aria-label="Download on the App Store"
          >
            <span class="badge-eyebrow">Download on the</span>
            <span class="badge-store">App Store</span>
          </a>
          <a
            href="https://play.google.com/store/apps/details?id=app.flixy"
            class="badge"
            aria-label="Get it on Google Play"
          >
            <span class="badge-eyebrow">Get it on</span>

          </a>
        </div>

        <p class="coming-soon">Launching soon. Apps go live with the public release.</p>
      </div>

        <nav>
          <a href="/privacy.html">Privacy</a>
          <a href="/terms.html">Terms</a>
          <a href="mailto:hello@flixy.app">Contact</a>

    <script>
      document.getElementById('year').textContent = new Date().getFullYear();
