# New user — sign up, complete onboarding, first cold-start swipe.
# Maps to FSD § 15 New User journey.
appId: app.flixy.mobile
---
- launchApp:
    clearState: true
- assertVisible: "Flixy"
- tapOn: "Continue with email"
- evalScript: ${output.timestamp = new Date().getTime()}
- inputText: "qa+${output.timestamp}@flixy.app"
- pressKey: Tab
- inputText: "Test1234!"
- tapOn: "Create account"
- assertVisible:
    text: "Where are you"
    timeout: 8000
- tapOn: "US"
- tapOn: "Continue"
- tapOn: "Netflix"
- tapOn: "Continue"
- tapOn: "Action"
- tapOn: "Drama"
- tapOn: "Thriller"
- tapOn: "Continue"
- assertVisible:
    id: "swipe-card"
    timeout: 8000
- swipe:
    direction: RIGHT
- swipe:
    direction: LEFT
- swipe:
    direction: RIGHT
- swipe:
    direction: LEFT
- swipe:
    direction: RIGHT
- swipe:
    direction: LEFT
- swipe:
    direction: RIGHT
- swipe:
    direction: LEFT
- swipe:
    direction: RIGHT
- swipe:
    direction: LEFT
- assertVisible: "Taste captured!"
- tapOn: "Continue"
- assertVisible: "Notifications"
- tapOn: "Maybe later"
- assertVisible: "Flixy"
